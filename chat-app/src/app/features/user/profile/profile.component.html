<mat-card class="profile-card">

  <!-- Header section -->
  <div class="profile-header">
    <img src="{{environment.fileUrl+'/'+this.userResponse.data[0].profileurl}}" class="avatar" alt="Avatar" (click)="fileInput.click()" />
    <input type="file" #fileInput style="display: none" (change)="onFileSelected($event)" />
    <h2>{{ profileForm.value.fullName }}</h2>
    <p>{{ profileForm.value.email }}</p>
  </div>

  <mat-divider></mat-divider>

  <!-- Form section -->
  <form [formGroup]="profileForm" class="profile-form">

    <mat-form-field appearance="outline">
      <mat-label>First Name</mat-label>
      <input matInput formControlName="firstName" />
    </mat-form-field>

    
    <mat-form-field appearance="outline">
      <mat-label>Last Name</mat-label>
      <input matInput formControlName="lastName" />
    </mat-form-field>

      <mat-form-field appearance="outline"  >
    <mat-label>Gender</mat-label>
    <mat-select formControlName="gender">
      <mat-option [value]="1">Male</mat-option>
      <mat-option [value]="2">Female</mat-option>
      <mat-option [value]="3">Other</mat-option>
    </mat-select>
  </mat-form-field>



    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Phone</mat-label>
      <input matInput formControlName="phone" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Address</mat-label>
      <textarea matInput rows="3" formControlName="address"></textarea>
    </mat-form-field>

    <div class="btn-row">
      <button mat-raised-button color="primary" (click)="save()">
        Save
      </button>

      <button mat-stroked-button color="warn" (click)="cancel()">
        Cancel
      </button>
    </div>

  </form>

</mat-card>
