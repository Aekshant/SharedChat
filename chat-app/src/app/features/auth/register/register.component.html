<div class="flex justify-center items-center min-h-screen bg-gray-100 p-4">
  <p-card class="w-full max-w-md shadow-xl rounded-2xl">
    <h2 class="text-2xl font-semibold mb-4 text-center">Create Account</h2>

    <form (ngSubmit)="onRegister()" class="flex flex-col gap-4">

      <span class="p-float-label">
        <input pInputText id="name" [(ngModel)]="name" name="name" class="w-full" />
        <label for="name">Full Name</label>
      </span>

      <span class="p-float-label">
        <input pInputText id="email" [(ngModel)]="email" name="email" class="w-full" />
        <label for="email">Email</label>
      </span>

      <span class="p-float-label">
        <input pPassword id="password" [(ngModel)]="password" name="password" toggleMask class="w-full" />
        <label for="password">Password</label>
      </span>

      <button pButton type="submit" label="Register" class="w-full"></button>

      <p class="text-center text-sm">
        Already have an account?
        <a routerLink="/login" class="text-blue-500 underline">Login</a>
      </p>

    </form>
  </p-card>
</div>
