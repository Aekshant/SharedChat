<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="w-full max-w-md overflow-visible relative">
    <p-card class="shadow-2xl w-full rounded-2xl">

      <!-- Centered Header -->
      <ng-template pTemplate="header">
        <h2 class="text-2xl font-bold text-center w-full mt-2">Login</h2>
      </ng-template>

      <!-- Form with padding -->
      <div class="px-6 pb-6 pt-2">
        <form class="space-y-6">

          <!-- Email -->
          <div class="flex flex-col gap-2">
            <label class="font-medium text-gray-700">Email</label>
            <input pInputText type="email" [(ngModel)]="email" name="email" class="w-full"
              placeholder="Enter your email" />
          </div>

          <!-- Password -->
          <div class="flex flex-col gap-2">
            <label class="font-medium text-gray-700">Password</label>
            <input pPassword [(ngModel)]="password" name="password" [feedback]="false" class="w-full"
              placeholder="••••••••" inputStyleClass="w-full" />
          </div>

          <!-- Login Button -->
          <button pButton type="button" label="Login" class="w-full"  (click)="router.navigate(['/chat'])"></button>

          <!-- Register link -->
          <div class="text-center text-sm text-gray-600">
            Don't have an account?
            <a routerLink="/auth/register" class="text-blue-600 hover:underline">
              Register
            </a>
          </div>

        </form>
      </div>
    </p-card>
  </div>
</div>
