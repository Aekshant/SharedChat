<div class="h-full flex flex-col">

  <div class="p-4 text-lg font-semibold border-b border-gray-600">
    Users
  </div>

  <p-scrollPanel class="flex-1">
    <div>
      <div *ngIf="userResponse">
        <div *ngFor="let user of userResponse.data  " (click)="selectUser(user)"
          class="flex items-center gap-3 px-4 py-3 hover:bg-gray-700 cursor-pointer">

          <p-avatar [label]="user.firstname[0]"></p-avatar>

          <div>
            <div class="font-medium">{{ user.firstname }}</div>
            <!-- <div class="text-sm text-gray-300">{{ user.lastMessage }}</div> -->
          </div>

        </div>
        <p-divider></p-divider>
      </div>
    </div>
  </p-scrollPanel>

</div>
