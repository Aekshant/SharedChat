<mat-sidenav-container class="chat-container">

  <!-- SIDEBAR -->
  <mat-sidenav
    #sidenav
    mode="side"
    class="sidebar"
    [opened]="isDesktop"
  >
    <app-user-list
      (userSelected)="onUserSelected($event)"
      class="sidebar-content"
    ></app-user-list>
  </mat-sidenav>

  <!-- MAIN CHAT AREA -->
  <mat-sidenav-content class="chat-content">

    <!-- MOBILE HEADER -->
    <div class="mobile-header">
      <h2>Chats</h2>
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>{{ sidenav.opened ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>

    <!-- CHAT WINDOW -->
    <ng-container *ngIf="selectedUser; else noUser">

      <app-chat-window
        [selectedUser]="selectedUser"
      ></app-chat-window>
    </ng-container>

    <!-- EMPTY STATE WHEN NO USER SELECTED -->
    <ng-template #noUser>
      <div class="empty-state">
        <p>Select a user to start chatting</p>
      </div>
    </ng-template>

  </mat-sidenav-content>
</mat-sidenav-container>
