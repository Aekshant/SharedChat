

<div class="flex h-screen bg-gray-900 overflow-hidden">
  <!-- MOBILE HEADER -->
  <div class="md:hidden bg-gray-800 p-4 flex items-center justify-between">
    <h2 class="text-white font-semibold text-lg">Chats</h2>
    <!-- Sidebar Toggle Button -->
    <button 
      class="text-white p-2"
      (click)="toggleSidebar()">
      <i class="pi" [ngClass]="sidebarOpen ? 'pi-times' : 'pi-bars'"></i>
    </button>
  </div>

  <!-- SIDEBAR (USER LIST) -->

  <div
    class="
      fixed 
      inset-y-0 left-0 
      w-72 
      bg-gray-800 
      border-r border-gray-700 
      transform 
      transition-transform duration-300 
      md:translate-x-0 
      md:static 
      md:block
    "
    [ngClass]="{'translate-x-0': sidebarOpen, '-translate-x-full': !sidebarOpen}"
  >
    <app-user-list
      class="h-full"
      (userSelected)="onUserSelected($event)"
    ></app-user-list>
  </div>

  <!-- CHAT WINDOW -->
  <div class="flex-1 h-full">
    <!-- <div *ngIf="selectedUser"> -->
      <div [ngStyle]="{'display' : selectedUser ? '' : 'none'}" class="h-full">
      <app-chat-window
      [selectedUser]="selectedUser"
      (backToUsers)="closeSidebarOnMobile()"
      ></app-chat-window>
    </div>
    <div [ngStyle]="{'display': selectedUser ? 'none' : ''}" class="h-full">
    <!-- <div *ngIf="!selectedUser"> -->
      <div class="h-full flex items-center justify-center">
        <p class="text-gray-400">Select a user to start chatting</p>
      </div>
    </div>
  </div>

</div>
