<div class="chat-container">

  <!-- HEADER -->
  <div class="chat-header">
    <div class="avatar">
      {{ selectedUser?.firstname[0] }}
    </div>

    <div>
      <p class="name">{{ selectedUser?.firstname }} {{ selectedUser?.userid }}</p>
      <p class="status">Online</p>
    </div>
  </div>

  <!-- MESSAGES -->
  <div class="chat-messages" #scrollContainer>

    <div *ngFor="let msg of messages">

      <div class="message-wrapper"
           [ngClass]="{
             'me': msg.from === currentUser.userid && msg.to === selectedUser?.userid,
             'other': msg.from === selectedUser?.userid && msg.to === currentUser.userid
           }"
           [ngStyle]="{
             'display': (msg.from === currentUser.userid && msg.to === selectedUser?.userid)
                        || (msg.from === selectedUser?.userid && msg.to === currentUser.userid)
                        ? '' : 'none'
           }">

        <mat-card class="message-bubble">
          {{ msg.text }}
        </mat-card>

        <p class="timestamp">
          {{ msg.timestamp | date : 'dd-MMM-yyyy hh:mm:ss a' }}
        </p>

      </div>

    </div>

  </div>

  <!-- INPUT AREA -->
  <div class="chat-input">

    <mat-form-field class="input-full" appearance="outline">
      <input matInput [(ngModel)]="message"
             placeholder="Type a message..."
             (keyup.enter)="sendMessage()">
    </mat-form-field>

    <button mat-icon-button color="primary" (click)="sendMessage()">
      <mat-icon>send</mat-icon>
    </button>

  </div>

</div>
