<!-- HEADER -->
<header class="  flex items-center justify-between bg-gray-800 px-4 py-3 border-b border-gray-700">
  
  <!-- APP NAME -->
  <div class="text-xl font-semibold">
    ChatRoom
  </div>

  <!-- PROFILE DROPDOWN -->
  <div class="relative" x-data="{ open: false }">
    <button 
       class="flex items-center space-x-2 bg-gray-700 px-3 py-2 rounded-full hover:bg-gray-600"
    >
      <span class="font-semibold">
        <img [src]="user?.avatar" alt="Avatar" class="w-6 h-6 rounded-full">
        <p>{{user.userid}}  </p>
      </span>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M19 9l-7 7-7-7"/>
      </svg>
    </button>

    <!-- MENU -->
    <div 
      x-show="open"
       class="absolute right-0 mt-2 w-40 bg-gray-800 border border-gray-700 rounded-lg shadow-lg"
    >
      <!-- <button class="block w-full text-left px-4 py-2 hover:bg-gray-700"
        (click)="onViewProfile()">
        View Profile
      </button>

      <button class="block w-full text-left px-4 py-2 hover:bg-gray-700"
        (click)="onLogout()">
        Logout
      </button> -->
    </div>
  </div>

</header>
